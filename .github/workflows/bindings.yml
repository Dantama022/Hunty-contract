name: Generate Contract Bindings

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      - name: Build contracts
        run: cargo build --workspace --target wasm32-unknown-unknown --release

      - name: Generate TypeScript bindings
        run: make bindings

      - name: Check for uncommitted changes in bindings
        run: git diff --exit-code bindings

      - name: Upload bindings artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contract-bindings
          path: bindings/
